name: Publish v0.4.0 metadata to MCP Registry

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: mcp-registry-v0.4.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'scrape-badger/scrapebadger-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579

    steps:
      - name: Checkout reviewed v0.4.0 metadata
        uses: actions/checkout@v4
        with:
          ref: bb5993811176b465faae3ea2f2c55d40bbec6642 # v0.4.0
          persist-credentials: false

      - name: Check release metadata and existing PyPI package
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bb5993811176b465faae3ea2f2c55d40bbec6642
          jq -e '
            .name == "io.github.scrape-badger/scrapebadger" and
            .version == "0.4.0" and
            (.packages | length == 1) and
            .packages[0].registryType == "pypi" and
            .packages[0].identifier == "scrapebadger-mcp" and
            .packages[0].version == "0.4.0"
          ' server.json
          curl --fail --location --silent --show-error \
            https://pypi.org/pypi/scrapebadger-mcp/0.4.0/json \
            --output "$RUNNER_TEMP/pypi-0.4.0.json"
          jq -e '
            .info.name == "scrapebadger-mcp" and
            .info.version == "0.4.0" and
            (.urls | length > 0) and
            (.urls | all(.yanked == false))
          ' "$RUNNER_TEMP/pypi-0.4.0.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify pinned mcp-publisher
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$archive" | sha256sum --check --strict
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Validate released server metadata
        run: '"$RUNNER_TEMP/mcp-publisher" validate'

      - name: Authenticate with GitHub Actions OIDC
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      - name: Publish metadata to MCP Registry
        run: '"$RUNNER_TEMP/mcp-publisher" publish'
