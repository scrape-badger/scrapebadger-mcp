name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --refresh

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Run formatter check
        run: uv run ruff format --check src/ tests/

      - name: Run type checker
        run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --refresh

      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          SCRAPEBADGER_API_KEY: "test_key_for_ci"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t scrapebadger-mcp:ci .

      # What an MCP directory does: start the image with no key and no network, list the
      # tools over stdio, and call one (which must return the missing-key error).
      - name: List tools over stdio without an API key
        run: |
          set -euo pipefail
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            echo '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"grok_list_models","arguments":{}}}'
            sleep 5
          } | timeout 60 docker run -i --rm --network none scrapebadger-mcp:ci > out.jsonl
          jq -c 'select(.id == 2) | [.result.tools[].name]' out.jsonl
          jq -e 'select(.id == 2) | (.result.tools | length) > 0' out.jsonl
          jq -e 'select(.id == 3) | .result.isError and
            (.result.content[0].text | contains("SCRAPEBADGER_API_KEY is not set"))' out.jsonl
